<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סלע בית השקעות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Rubik', sans-serif;
  direction: rtl;
  color: #333;
  background: #fff;
  line-height: 1.6;
}

/* ===== CSS VARIABLES ===== */
:root {
  --navy:        #1B3A6B;
  --navy-dark:   #0f2549;
  --white:       #ffffff;
  --gray-light:  #f7f8fc;
  --gray-text:   #555555;
  --gray-border: #e0e6f0;
  --nav-height:  64px;
}

/* ===== UTILITY ===== */
.container { max-width: 1100px; margin: 0 auto; padding: 0 40px; }
.section { display: none; }
.section.active { display: block; }

/* ===== SECTION HEADERS ===== */
.section-label {
  color: var(--navy);
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 600;
  opacity: 0.6;
  text-align: center;
  margin-bottom: 10px;
}
.section-h2 {
  color: var(--navy);
  font-size: 28px;
  font-weight: 600;
  text-align: center;
  margin-bottom: 48px;
}

/* ===== BUTTONS ===== */
.btn-primary {
  display: inline-block;
  background: var(--navy);
  color: var(--white);
  padding: 13px 34px;
  border-radius: 5px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  font-family: 'Rubik', sans-serif;
  text-decoration: none;
}
.btn-primary:hover { background: var(--navy-dark); }
.btn-outline {
  display: inline-block;
  border: 1.5px solid var(--navy);
  color: var(--navy);
  padding: 13px 34px;
  border-radius: 5px;
  font-size: 14px;
  font-weight: 600;
  background: transparent;
  cursor: pointer;
  font-family: 'Rubik', sans-serif;
  text-decoration: none;
}
.btn-outline:hover { background: var(--gray-light); }

/* ===== NAVBAR ===== */
#navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--navy);
  height: var(--nav-height);
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.nav-inner {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nav-logo { color: var(--white); font-size: 18px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.nav-logo span { font-weight: 300; font-size: 14px; opacity: 0.85; margin-right: 4px; }
.nav-links { display: flex; gap: 28px; list-style: none; }
.nav-links a {
  color: rgba(255,255,255,0.8);
  font-size: 14px;
  text-decoration: none;
  cursor: pointer;
  padding-bottom: 2px;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  white-space: nowrap;
}
.nav-links a:hover, .nav-links a.active {
  color: var(--white);
  border-bottom-color: var(--white);
}
.nav-cta {
  background: var(--white);
  color: var(--navy);
  padding: 9px 22px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  font-family: 'Rubik', sans-serif;
  white-space: nowrap;
}
.nav-cta:hover { background: #e8edf5; }
.nav-hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 4px;
  background: none;
  border: none;
}
.nav-hamburger span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--white);
  border-radius: 2px;
}

/* ===== HERO ===== */
.hero {
  background: var(--white);
  padding: 80px 0;
  text-align: center;
  border-bottom: 1px solid var(--gray-border);
}
.hero-label {
  color: var(--navy);
  font-size: 11px;
  letter-spacing: 4px;
  font-weight: 600;
  opacity: 0.6;
  margin-bottom: 20px;
}
.hero-title {
  color: var(--navy);
  font-size: 42px;
  font-weight: 300;
  line-height: 1.35;
  margin-bottom: 20px;
}
.hero-title strong { font-weight: 700; }
.hero-body {
  color: var(--gray-text);
  font-size: 16px;
  line-height: 1.8;
  margin-bottom: 36px;
  max-width: 560px;
  margin-left: auto;
  margin-right: auto;
}
.hero-buttons { display: flex; gap: 16px; justify-content: center; }

/* ===== ABOUT STRIP ===== */
.about-strip { background: var(--navy); padding: 60px 0; }
.about-strip-label {
  color: rgba(255,255,255,0.5);
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 600;
  margin-bottom: 12px;
}
.about-strip-title { color: var(--white); font-size: 22px; font-weight: 600; margin-bottom: 24px; }
.about-strip-text { color: rgba(255,255,255,0.82); font-size: 14px; line-height: 1.9; }
.about-strip-text p { margin-bottom: 14px; }
.about-strip-text p:last-child { margin-bottom: 0; }
.license-tag {
  display: inline-block;
  margin-top: 20px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.7);
  font-size: 12px;
  padding: 6px 16px;
  border-radius: 20px;
}

/* ===== SERVICES ===== */
.services { background: var(--gray-light); padding: 72px 0; }
.service-cards { display: flex; gap: 28px; }
.service-card {
  flex: 1;
  background: var(--white);
  border-radius: 10px;
  padding: 36px 32px;
  border: 1px solid var(--gray-border);
  box-shadow: 0 2px 12px rgba(27,58,107,0.06);
}
.service-icon { font-size: 30px; margin-bottom: 16px; }
.service-card h3 { color: var(--navy); font-size: 20px; font-weight: 700; margin-bottom: 12px; }
.service-card p { color: var(--gray-text); font-size: 14px; line-height: 1.75; margin-bottom: 20px; }
.service-link {
  color: var(--navy);
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  border-bottom: 1px solid var(--navy);
  padding-bottom: 1px;
  cursor: pointer;
}

/* ===== PAGE HERO (inner pages) ===== */
.page-hero {
  background: var(--navy);
  padding: 60px 0;
  text-align: center;
  color: var(--white);
}
.page-hero h2 { font-size: 36px; font-weight: 300; margin-bottom: 10px; }
.page-hero h2 strong { font-weight: 700; }
.page-hero p { font-size: 15px; opacity: 0.75; margin-top: 8px; }

/* ===== CONTENT SECTIONS ===== */
.content-section { padding: 72px 0; }
.content-section.gray { background: var(--gray-light); }
.two-col { display: flex; gap: 56px; align-items: flex-start; }
.two-col .text-col { flex: 1; }
.two-col h3 { color: var(--navy); font-size: 22px; font-weight: 600; margin-bottom: 20px; }
.two-col p { color: var(--gray-text); font-size: 15px; line-height: 1.85; margin-bottom: 16px; }

/* ===== BENEFIT CARDS 2x2 ===== */
.benefit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.benefit-card {
  background: var(--white);
  border: 1px solid var(--gray-border);
  border-radius: 10px;
  padding: 28px 24px;
  box-shadow: 0 2px 8px rgba(27,58,107,0.05);
}
.benefit-card .bicon { font-size: 26px; margin-bottom: 12px; }
.benefit-card h4 { color: var(--navy); font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.benefit-card p { color: var(--gray-text); font-size: 13px; line-height: 1.7; margin: 0; }

/* ===== CONTACT STRIP (funds page) ===== */
.contact-strip {
  background: var(--navy);
  padding: 52px 0;
  text-align: center;
  color: var(--white);
}
.contact-strip p { opacity: 0.8; font-size: 15px; margin-bottom: 28px; }
.contact-info { display: flex; gap: 48px; justify-content: center; align-items: center; flex-wrap: wrap; }
.contact-detail { font-size: 15px; }
.contact-detail strong { display: block; font-size: 18px; margin-bottom: 4px; }
.contact-detail a { color: rgba(255,255,255,0.85); text-decoration: none; }
.contact-detail a:hover { color: var(--white); text-decoration: underline; }

/* ===== CTA STRIP ===== */
.cta-strip { background: var(--gray-light); padding: 64px 0; text-align: center; }
.cta-strip h3 { color: var(--navy); font-size: 24px; font-weight: 600; margin-bottom: 28px; }

/* ===== ABOUT PAGE ===== */
.values-strip { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 48px; }
.value-pill {
  background: var(--navy);
  color: var(--white);
  padding: 10px 32px;
  border-radius: 24px;
  font-size: 14px;
  font-weight: 600;
}
.key-numbers { display: flex; flex-direction: column; gap: 20px; min-width: 190px; }
.key-number {
  background: var(--navy);
  color: var(--white);
  border-radius: 10px;
  padding: 24px;
  text-align: center;
}
.key-number .num { font-size: 28px; font-weight: 700; }
.key-number .lbl { font-size: 12px; opacity: 0.75; margin-top: 4px; }

/* ===== CONTACT PAGE ===== */
.contact-layout { display: flex; gap: 56px; align-items: flex-start; }
.contact-card {
  background: var(--navy);
  color: var(--white);
  border-radius: 12px;
  padding: 40px 36px;
  min-width: 270px;
}
.contact-card h3 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.contact-card .role { opacity: 0.7; font-size: 14px; margin-bottom: 32px; }
.contact-card .cline { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-size: 15px; }
.contact-card a { color: rgba(255,255,255,0.85); text-decoration: none; }
.contact-card a:hover { color: var(--white); text-decoration: underline; }
.contact-form { flex: 1; }
.contact-form .field { margin-bottom: 20px; }
.contact-form label { display: block; color: var(--navy); font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid var(--gray-border);
  border-radius: 6px;
  font-family: 'Rubik', sans-serif;
  font-size: 14px;
  color: #333;
  background: var(--white);
  direction: rtl;
  transition: border-color 0.2s;
}
.contact-form input:focus,
.contact-form textarea:focus { outline: none; border-color: var(--navy); }
.contact-form textarea { height: 130px; resize: vertical; }
.form-success {
  display: none;
  background: #e8f5e9;
  color: #2e7d32;
  padding: 16px 20px;
  border-radius: 6px;
  font-size: 14px;
  margin-top: 16px;
  border: 1px solid #a5d6a7;
}

/* ===== FOOTER ===== */
.site-footer { background: var(--navy-dark); color: var(--white); }
.footer-main {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 32px;
  padding: 48px 0 40px;
}
.footer-logo-name { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.footer-logo-name span { font-weight: 300; font-size: 14px; }
.footer-legal { color: rgba(255,255,255,0.45); font-size: 11px; max-width: 240px; line-height: 1.65; margin-top: 8px; }
.footer-links { display: flex; flex-direction: column; gap: 10px; }
.footer-links a {
  color: rgba(255,255,255,0.6);
  font-size: 13px;
  text-decoration: none;
  cursor: pointer;
  transition: color 0.2s;
}
.footer-links a:hover { color: var(--white); }
.footer-bottom {
  border-top: 1px solid rgba(255,255,255,0.1);
  padding: 16px 0;
  text-align: center;
  color: rgba(255,255,255,0.35);
  font-size: 12px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .container { padding: 0 20px; }
  .nav-links { display: none; flex-direction: column; gap: 0; position: absolute; top: var(--nav-height); right: 0; left: 0; background: var(--navy-dark); padding: 12px 0; }
  .nav-links.open { display: flex; }
  .nav-links a { padding: 12px 24px; border-bottom: none !important; }
  .nav-cta { display: none; }
  .nav-hamburger { display: flex; }
  .hero-title { font-size: 28px; }
  .hero-buttons { flex-direction: column; align-items: center; }
  .service-cards { flex-direction: column; }
  .benefit-grid { grid-template-columns: 1fr; }
  .two-col { flex-direction: column; }
  .key-numbers { flex-direction: row; flex-wrap: wrap; min-width: unset; }
  .contact-layout { flex-direction: column; }
  .contact-card { min-width: unset; width: 100%; }
  .contact-info { flex-direction: column; gap: 20px; }
  .footer-main { flex-direction: column; gap: 24px; }
}
</style>
</head>

// ===== NAVIGATION =====
function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  document.querySelectorAll('.nav-links a').forEach(a => {
    a.classList.toggle('active', a.dataset.section === id);
  });
  window.location.hash = id;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  // close mobile menu
  document.getElementById('navLinks').classList.remove('open');
}

function toggleMenu() {
  document.getElementById('navLinks').classList.toggle('open');
}

// ===== FOOTER HTML =====
function buildFooterHTML() {
  const s = CONTENT.site;
  const links = CONTENT.nav.map(n =>
    `<a onclick="showSection('${n.id}')">${n.label}</a>`
  ).join('');
  return `
    <div class="site-footer">
      <div class="container">
        <div class="footer-main">
          <div>
            <div class="footer-logo-name">${s.name} <span>${s.tagline}</span></div>
            <div class="footer-legal">${s.legal}</div>
          </div>
          <div class="footer-links">${links}</div>
        </div>
      </div>
      <div class="footer-bottom">
        <div class="container">${s.copyright}</div>
      </div>
    </div>`;
}

// ===== BUILD NAVBAR =====
function buildNavbar() {
  const nav = document.getElementById('navbar');
  const links = CONTENT.nav.map(item =>
    `<a data-section="${item.id}" onclick="showSection('${item.id}')">${item.label}</a>`
  ).join('');
  nav.innerHTML = `
    <div class="container">
      <div class="nav-inner">
        <button class="nav-cta" onclick="showSection('contact')">${CONTENT.nav[4].label}</button>
        <ul class="nav-links" id="navLinks">${links}</ul>
        <div class="nav-logo" onclick="showSection('home')">
          ${CONTENT.site.name} <span>${CONTENT.site.tagline}</span>
        </div>
        <button class="nav-hamburger" onclick="toggleMenu()" aria-label="תפריט">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>`;
  document.querySelector(`.nav-links a[data-section="home"]`).classList.add('active');
}
